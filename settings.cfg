; Runtime Settings Configuration File
; Auto-generated base settings for Delaunay Triangulation Map Generation
; 
; This file is loaded on startup. Values here override the defaults
; specified in each IConfigurable implementation.
;
; To reset all settings to defaults, either:
; 1. Delete this file
; 2. Use the console command: settings reset_all
; 3. Use the Settings Panel UI: click "Reset All"

