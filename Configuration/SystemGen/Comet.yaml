categories:
  potential:
    - mythology
    - scientists
    - explorers
    - adjectives

satellite:
  template:
    apogee: 800
    perigee: 200
    starting_angle: 0
    vertical_offset: 0
    size_range: [3, 8]
    mass_range: [5, 20]

  # Phase 8: type-level safe-default midpoints. Per-subtype ranges live in
  # Configuration/Subtypes/satellite_subtypes.yaml.
  mesh:
    base_mesh:
      subdivisions: 1
      vertices_per_edge: [[2, 2]]
      num_abberations: 0
      num_deformation_cycles: 0

    spherical_harmonics:
      amplitude_range: [0.65, 0.65]

    # noise_settings is a separate (non-subtype) generation knob; keep as range.
    noise_settings:
      amplitude_range: [0.03, 0.1]
      scaling_range: [0.3, 1.2]
      octave_range: [2, 4]
      lacunarity: 2.0
      gain: 0.5
