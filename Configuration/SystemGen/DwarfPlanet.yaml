categories:
  potential:
    - mythology
    - scientists
    - explorers
    - adjectives

celestial:
  template:
    apogee: 2000
    perigee: 1000
    starting_angle: 0
    vertical_offset: 0
    mass: 200
    size: 30
    # Dwarf planets effectively have no atmosphere — wind power disabled here.
    atmosphere: [0.0, 0.05]

  # Phase 8: type-level safe-default midpoints. Per-subtype ranges live in
  # Configuration/Subtypes/dwarf_planet_subtypes.yaml.
  mesh:
    base_mesh:
      subdivisions: 1
      vertices_per_edge: [[7, 7]]
      num_abberations: 3
      num_deformation_cycles: 3

    tectonic:
      num_continents: [33, 33]
      stress_scale: [5.5, 5.5]
      shear_scale: [1.35, 1.35]
      max_propagation_distance: [0.25, 0.25]
      propagation_falloff: [1.15, 1.15]
      inactive_stress_threshold: [0.055, 0.055]
      general_height_scale: [1.0, 1.0]
      general_shear_scale: [14.0, 14.0]
      general_compression_scale: [30.0, 30.0]
      general_transform_scale: [1.25, 1.25]

    # noise_settings is a separate (non-subtype) generation knob; keep as range.
    noise_settings:
      amplitude_range: [0.5, 1.2]
      scaling_range: [0.2, 1.7]
      octave_range: [2, 4]
      lacunarity: 5.0
      gain: 4.5

satellite:
  template:
    apogee: 500
    perigee: 300
    starting_angle: 0
    vertical_offset: 0
    size_range: [8, 20]
    mass_range: [20, 50]

  mesh:
    base_mesh:
      subdivisions: 1
      vertices_per_edge: [[2, 2]]
      num_abberations: 0
      num_deformation_cycles: 0

    tectonic:
      num_continents: [33, 33]
      stress_scale: [5.5, 5.5]
      shear_scale: [1.35, 1.35]
      max_propagation_distance: [0.25, 0.25]
      propagation_falloff: [1.15, 1.15]
      inactive_stress_threshold: [0.055, 0.055]
      general_height_scale: [1.0, 1.0]
      general_shear_scale: [14.0, 14.0]
      general_compression_scale: [30.0, 30.0]
      general_transform_scale: [1.25, 1.25]

    noise_settings:
      amplitude_range: [0.5, 1.2]
      scaling_range: [0.2, 1.7]
      octave_range: [2, 4]
      lacunarity: 5.0
      gain: 4.5
