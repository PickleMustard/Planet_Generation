categories:
  potential:
    - mythology
    - scientists
    - explorers
    - adjectives

celestial:
  template:
    apogee: 500
    perigee: 300
    starting_angle: 0
    vertical_offset: 0
    mass: 1000
    size: 150
    # Atmospheric pressure range in atmospheres (1.0 = Earth standard).
    # Rocky planets span thin (Mars-like) to thick (Venus-like).
    atmosphere: [0.0, 2.0]

  mesh:
    base_mesh:
      subdivisions: 2
      vertices_per_edge: [[4, 6], [2, 3]]
      num_abberations: 3
      num_deformation_cycles: 3

    tectonic:
      num_continents: [13, 25]
      stress_scale: [1.1, 1.3]
      shear_scale: [1.1, 1.3]
      max_propagation_distance: [0.01, 0.03]
      propagation_falloff: [0.1, 0.2]
      inactive_stress_threshold: [0.01, 0.03]
      general_height_scale: [0.6, 1.0]
      general_shear_scale: [1.1, 1.4]
      general_compression_scale: [1.2, 1.5]
      general_transform_scale: [1.0, 1.2]
