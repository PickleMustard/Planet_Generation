    secondary:
      - resource_id: gold_ore
        base_weight: 0.3
        elevation_weight_curve: [0.0, 0.1, 0.3, 0.7, 0.9]
      - resource_id: uranium_ore
        base_weight: 0.2
        elevation_weight_curve: [0.0, 0.2, 0.4, 0.8, 0.9]
      - resource_id: platinum_ore
        base_weight: 0.15
        elevation_weight_curve: [0.0, 0.1, 0.3, 0.6, 0.8]
      - resource_id: cobalt_ore
        base_weight: 0.25
        elevation_weight_curve: [0.8, 0.6, 0.3, 0.2, 0.1]
      - resource_id: nickel_ore
        base_weight: 0.3
