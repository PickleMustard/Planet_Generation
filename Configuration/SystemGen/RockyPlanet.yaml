categories:
  potential:
    - mythology
    - scientists
    - explorers
    - adjectives

celestial:
  template:
    apogee: 500
    perigee: 300
    starting_angle: 0
    vertical_offset: 0
    mass: 1000
    size: 150
    # Atmospheric pressure range in atmospheres (1.0 = Earth standard).
    # Rocky planets span thin (Mars-like) to thick (Venus-like).
    atmosphere: [0.0, 2.0]

  # Phase 8: type-level safe-default midpoints. Real ranges live per-subtype in
  # Configuration/Subtypes/rocky_subtypes.yaml; SubtypeGenParamResolver consults those
  # first and only falls back here when the subtype is silent on a knob.
  mesh:
    base_mesh:
      subdivisions: 2
      vertices_per_edge: [[5, 5], [3, 3]]
      num_abberations: 3
      num_deformation_cycles: 3

    tectonic:
      num_continents: [19, 19]
      stress_scale: [1.2, 1.2]
      shear_scale: [1.2, 1.2]
      max_propagation_distance: [0.02, 0.02]
      propagation_falloff: [0.15, 0.15]
      inactive_stress_threshold: [0.02, 0.02]
      general_height_scale: [0.8, 0.8]
      general_shear_scale: [1.25, 1.25]
      general_compression_scale: [1.35, 1.35]
      general_transform_scale: [1.1, 1.1]
