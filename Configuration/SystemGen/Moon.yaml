categories:
  potential:
    - mythology
    - scientists
    - explorers
    - adjectives

satellite:
  template:
    apogee: 600
    perigee: 400
    starting_angle: 0
    vertical_offset: 0
    size_range: [25, 50]
    mass_range: [50, 150]

  # Phase 8: type-level safe-default midpoints. Per-subtype ranges live in
  # Configuration/Subtypes/satellite_subtypes.yaml.
  mesh:
    base_mesh:
      subdivisions: 1
      vertices_per_edge: [[2, 2]]
      num_abberations: 0
      num_deformation_cycles: 0

    # noise_settings is a separate (non-subtype) generation knob; keep as range.
    noise_settings:
      amplitude_range: [0.5, 1.2]
      scaling_range: [0.2, 1.7]
      octave_range: [2, 4]
      lacunarity: 5.0
      gain: 4.5

    tectonic:
      num_continents: [19, 19]
      stress_scale: [1.3, 1.3]
      shear_scale: [1.15, 1.15]
      max_propagation_distance: [0.14, 0.14]
      propagation_falloff: [0.018, 0.018]
      inactive_stress_threshold: [0.012, 0.012]
      general_height_scale: [0.5, 0.5]
      general_shear_scale: [1.1, 1.1]
      general_compression_scale: [1.15, 1.15]
      general_transform_scale: [1.1, 1.1]
      boundary_smoothing_iterations: [3, 3]
      boundary_smoothing_weight: [0.2, 0.2]
      max_continent_rotation: [60.0, 60.0]
      sample_velocity_at_edge_midpoint: true

  resources:
    main:
      - resource_id: water_ice
        base_weight: 1.0
        distance_weight: 1.0
      - resource_id: iron_ore
        base_weight: 0.8
        distance_weight: 1.0
      - resource_id: nickel_ore
        base_weight: 0.6
        distance_weight: 1.0
    secondary:
      - resource_id: cobalt_ore
        base_weight: 0.5
        distance_weight: 1.0
      - resource_id: platinum_ore
        base_weight: 0.3
        distance_weight: 1.0
      - resource_id: uranium_ore
        base_weight: 0.2
        distance_weight: 1.0
