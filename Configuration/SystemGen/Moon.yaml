categories:
  potential:
    - mythology
    - scientists
    - explorers
    - adjectives

satellite:
  template:
    apogee: 600
    perigee: 400
    starting_angle: 0
    vertical_offset: 0
    size_range: [25, 50]
    mass_range: [50, 150]

  mesh:
    base_mesh:
      subdivisions: 1
      vertices_per_edge: [[2, 3]]
      num_abberations: 0
      num_deformation_cycles: 0

    noise_settings:
      amplitude_range: [0.5, 1.2]
      scaling_range: [0.2, 1.7]
      octave_range: [2, 4]
      lacunarity: 5.0
      gain: 4.5

    tectonic:
      num_continents: [13, 25]
      stress_scale: [1.1, 1.5]
      shear_scale: [1.1, 1.2]
      max_propagation_distance: [0.13, 0.15]
      propagation_falloff: [0.015, 0.02]
      inactive_stress_threshold: [0.01, 0.015]
      general_height_scale: [0.5, 0.5]
      general_shear_scale: [1.0, 1.2]
      general_compression_scale: [1.1, 1.2]
      general_transform_scale: [1.0, 1.2]

  resources:
    main:
      - resource_id: water_ice
        base_weight: 1.0
        distance_weight: 1.0
      - resource_id: iron_ore
        base_weight: 0.8
        distance_weight: 1.0
      - resource_id: nickel_ore
        base_weight: 0.6
        distance_weight: 1.0
    secondary:
      - resource_id: cobalt_ore
        base_weight: 0.5
        distance_weight: 1.0
      - resource_id: platinum_ore
        base_weight: 0.3
        distance_weight: 1.0
      - resource_id: uranium_ore
        base_weight: 0.2
        distance_weight: 1.0
