categories:
  potential:
    - mythology
    - scientists
    - explorers
    - adjectives

satellite:
  template:
    apogee: 500
    perigee: 300
    starting_angle: 0
    vertical_offset: 0
    size_range: [5, 15]
    mass_range: [10, 30]

  # Phase 8: type-level safe-default midpoints. Per-subtype ranges live in
  # Configuration/Subtypes/satellite_subtypes.yaml.
  mesh:
    base_mesh:
      subdivisions: 1
      vertices_per_edge: [[2, 2]]
      num_abberations: 0
      num_deformation_cycles: 0

    spherical_harmonics:
      amplitude_range: [0.5, 0.5]

  resources:
    main:
      - resource_id: iron_ore
        base_weight: 1.0
        distance_weight: 1.0
      - resource_id: gold_ore
        base_weight: 0.8
        distance_weight: 1.2
      - resource_id: copper_ore
        base_weight: 0.6
        distance_weight: 1.0
    secondary:
      - resource_id: cobalt_ore
        base_weight: 0.4
        distance_weight: 1.0
      - resource_id: uranium_ore
        base_weight: 0.2
        distance_weight: 1.8
