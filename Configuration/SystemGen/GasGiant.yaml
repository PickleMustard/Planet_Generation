categories:
  potential:
    - mythology
    - scientists
    - explorers
    - adjectives

celestial:
  template:
    apogee: 8000
    perigee: 8000
    starting_angle: 0
    vertical_offset: 0
    mass: 17000
    size: 350
    # Atmospheric pressure range in atmospheres. Gas giants are crushingly dense;
    # standard wind turbines won't survive here — adapted variants pending.
    atmosphere: [50.0, 200.0]

  # Phase 8: type-level safe-default midpoints. Per-subtype ranges live in
  # Configuration/Subtypes/gas_giant_subtypes.yaml.
  mesh:
    base_mesh:
      subdivisions: 1
      vertices_per_edge: [[11, 11]]
      num_abberations: 0
      num_deformation_cycles: 0

    tectonic:
      num_continents: [5, 5]
      stress_scale: [0.9, 0.9]
      shear_scale: [0.6, 0.6]
      max_propagation_distance: [0.01, 0.01]
      propagation_falloff: [0.2, 0.2]
      inactive_stress_threshold: [0.01, 0.01]
      general_height_scale: [1.0, 1.0]
      general_shear_scale: [1.0, 1.0]
      general_compression_scale: [1.0, 1.0]
      general_transform_scale: [1.0, 1.0]
      boundary_smoothing_iterations: [3, 3]
      boundary_smoothing_weight: [0.2, 0.2]
      max_continent_rotation: [60.0, 60.0]
      sample_velocity_at_edge_midpoint: true
