# Biome Tag Probabilities Configuration
# Defines tags for each biome and probability adjustments for planetary type tags
# Tags are descriptive keywords that describe the biome's characteristics
# Probability modifiers adjust the likelihood of planetary type tags appearing in this biome

biomes:
  # Tundra - Cold, treeless plains with permafrost
  - biome: Tundra
    modifiers:
      - frozen: 1.2
      - high_metal: 0.0
      - water: 1.0

