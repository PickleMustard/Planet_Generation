recipes:
  - recipe_id: "blast_furnace"
    display_name: "Blast Furnace"
    description: Ores are smelted by blasting them inside a crucible
    category: smelting
    work_required: 10
    icon:
      resource: "res://Materials/Icons/default_recipe.tres"
    input_resources:
      - tag:ore: 1
    output_resources:
      - tag:metal: 1
  - recipe_id: "arc_furnace"
    display_name: "Arc Furnace"
    description: The heat required to liquefy the metal is generated through a powerful electric arc between two anodes
    category: smelting
    work_required: 8
    icon:
      resource: "res://Materials/Icons/default_recipe.tres"
    input_resources:
      - condensed_carbon: 2
      - tag:ore: 1
    output_resources:
      - tag:metal: 2
  - recipe_id: "glass_smelting"
    display_name: "Glass Smelting"
    description: The inputs are heated to several thousands of degrees, melting them into a workable slurry. The result after cooling is an incredibly hard and transparent material.
    category: smelting
    work_required: 4
    icon:
      resource: "res://Materials/Icons/default_recipe.tres"
    input_resources:
      - silicon: 5
    output_resources:
      - glass: 1
  - recipe_id: "concrete"
    display_name: "Concrete"
    category: smelting
    work_required: 15
    icon:
      resource: "res://Materials/Icons/default_recipe.tres"
    input_resources:
      - gravel: 5
      - water: 2
    output_resources:
      - concrete: 7
  - recipe_id: "brick_fire"
    display_name: "Brick Firing"
    category: smelting
    work_required: 10
    icon:
      resource: "res://Materials/Icons/default_recipe.tres"
    input_resources:
      - clay: 10
    output_resources:
      - bricks: 6
