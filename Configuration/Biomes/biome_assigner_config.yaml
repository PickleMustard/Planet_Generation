# Biome assigner config — drives ConfigurableBiomeAssigner per RockyPlanetSubtype.
# Auto-generated by BiomeEditor. Hand edits will round-trip but comments may be lost.

assigners:
  Scoured:
    moisture:
      mode: uniform_random
      random_min: 0
      random_max: 0.1
    rules:
      - { biome: Mountain, when: { height_above: 0.8 } }
      - { biome: StoneDesert, when: { height_above: 0.4 } }
      - { biome: SandDesert, when: { height_above: 0.1 } }
      - { biome: ScouredPlain, when: {} }

  Desert:
    moisture:
      mode: uniform_random
      random_min: 0
      random_max: 0.15
    rules:
      - { biome: Mountain, when: { height_above: 0.8 } }
      - { biome: StoneDesert, when: { height_above: 0.5 } }
      - { biome: SandDesert, when: { height_above: 0.2 } }
      - { biome: Desert, when: { height_above: 0.05 } }
      - { biome: StoneDesert, when: {} }

  Temperate:
    moisture:
      mode: whittaker
      base_offset: 0
      latitude_factor_divisor: 9
      size_factor_divisor: 100
      random_min: -0.4
      random_max: 0.2
      max_moisture: 2.7
      constant_offset: 0
    rules:
      - { biome: Icecap, when: { height_above: 0.9, abs_latitude_above: 0.9 } }
      - { biome: Mountain, when: { height_above: 0.68, height_below: 0.9 } }
      - { biome: Tundra, when: { height_above: 0.4, moisture_below: 0.5, abs_latitude_above: 0.8, abs_latitude_below: 0.9 } }
      - { biome: Taiga, when: { height_above: 0.4, moisture_above: 0.5, abs_latitude_above: 0.7, abs_latitude_below: 0.8 } }
      - { biome: Ocean, when: { height_below: 0.05 } }
      - { biome: Coastal, when: { height_below: 0.07 } }
      - { biome: Desert, when: { height_below: 0.3, moisture_below: 0.2, abs_latitude_above: 0.2, abs_latitude_below: 0.5 } }
      - { biome: Grassland, when: { height_below: 0.3, moisture_above: 0.2, moisture_below: 0.5 } }
      - { biome: Forest, when: { height_above: 0.3, moisture_above: 0.5, moisture_below: 0.7, abs_latitude_above: 0.2, abs_latitude_below: 0.5 } }
      - { biome: Rainforest, when: { moisture_above: 0.6, abs_latitude_above: 0, abs_latitude_below: 0.2 } }

  Tropical:
    moisture:
      mode: whittaker
      base_offset: 0
      latitude_factor_divisor: 9
      size_factor_divisor: 100
      random_min: -0.2
      random_max: 0.3
      max_moisture: 2.7
      constant_offset: 0
    rules:
      - { biome: Mountain, when: { height_above: 0.7 } }
      - { biome: Ocean, when: { height_below: 0.05 } }
      - { biome: Coastal, when: { height_below: 0.08 } }
      - { biome: Desert, when: { moisture_below: 0.15 } }
      - { biome: Rainforest, when: { moisture_above: 0.6 } }
      - { biome: Forest, when: { moisture_above: 0.35 } }
      - { biome: Swamp, when: { moisture_above: 0.15 } }
      - { biome: Grassland, when: {} }

  Ocean:
    moisture:
      mode: uniform_random
      random_min: 0.8
      random_max: 1
    rules:
      - { biome: Mountain, when: { height_above: 0.85 } }
      - { biome: Grassland, when: { height_above: 0.75 } }
      - { biome: Coastal, when: { height_above: 0.65 } }
      - { biome: ShallowOcean, when: { height_above: 0.35 } }
      - { biome: DeepOcean, when: {} }

  Cool:
    moisture:
      mode: whittaker
      base_offset: 0
      latitude_factor_divisor: 9
      size_factor_divisor: 100
      random_min: -0.4
      random_max: 0.2
      max_moisture: 2.7
      constant_offset: 0.3
    rules:
      - { biome: Icecap, when: { height_above: 0.85 } }
      - { biome: Mountain, when: { height_above: 0.65 } }
      - { biome: Glacier, when: { height_above: 0.4, abs_latitude_above: 0.6 } }
      - { biome: Tundra, when: { height_above: 0.4, abs_latitude_above: 0.4 } }
      - { biome: Ocean, when: { height_below: 0.05 } }
      - { biome: Coastal, when: { height_below: 0.07 } }
      - { biome: FrozenPlain, when: { moisture_below: 0.3 } }
      - { biome: Tundra, when: { moisture_below: 0.6 } }
      - { biome: Taiga, when: {} }

  Ice:
    moisture:
      mode: uniform_random
      random_min: 0.7
      random_max: 0.9
    rules:
      - { biome: Mountain, when: { height_above: 0.8 } }
      - { biome: Icecap, when: { height_above: 0.6 } }
      - { biome: Glacier, when: { height_above: 0.4 } }
      - { biome: Desert, when: { height_above: 0.2, moisture_below: 0.3 } }
      - { biome: Tundra, when: { height_above: 0.2 } }
      - { biome: FrozenPlain, when: {} }

  Rusted:
    moisture:
      mode: uniform_random
      random_min: 0
      random_max: 0.2
    rules:
      - { biome: RustedMountain, when: { height_above: 0.8 } }
      - { biome: RustedDesert, when: { height_above: 0.55 } }
      - { biome: RustedPlain, when: { height_above: 0.3 } }
      - { biome: SandDesert, when: { height_above: 0.1 } }
      - { biome: RustedPlain, when: {} }

  Volcanic:
    moisture:
      mode: uniform_random
      random_min: 0
      random_max: 0.1
    rules:
      - { biome: VolcanicPeak, when: { height_above: 0.8 } }
      - { biome: ObsidianField, when: { height_above: 0.55 } }
      - { biome: AshPlain, when: { height_above: 0.3 } }
      - { biome: VolcanicPlain, when: { height_above: 0.1 } }
      - { biome: LavaOcean, when: {} }

