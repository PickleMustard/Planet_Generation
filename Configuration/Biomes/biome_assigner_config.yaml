# Biome assigner config — drives ConfigurableBiomeAssigner per RockyPlanetSubtype.
# Auto-generated by BiomeEditor. Hand edits will round-trip but comments may be lost.

assigners:
  Scoured:
    moisture:
      mode: uniform_random
      random_min: 0
      random_max: 0.1
    rules:
      - { biome: biome_mountain, when: { height_above: 0.8 } }
      - { biome: biome_stone_desert, when: { height_above: 0.4 } }
      - { biome: biome_sand_desert, when: { height_above: 0.1 } }
      - { biome: biome_scoured_plain, when: {} }

  Desert:
    moisture:
      mode: uniform_random
      random_min: 0
      random_max: 0.15
    rules:
      - { biome: biome_mountain, when: { height_above: 0.8 } }
      - { biome: biome_stone_desert, when: { height_above: 0.5 } }
      - { biome: biome_sand_desert, when: { height_above: 0.2 } }
      - { biome: biome_desert, when: { height_above: 0.05 } }
      - { biome: biome_stone_desert, when: {} }

  Temperate:
    moisture:
      mode: whittaker
      base_offset: 0
      latitude_factor_divisor: 9
      size_factor_divisor: 100
      random_min: -0.4
      random_max: 0.2
      max_moisture: 2.7
      constant_offset: 0
    rules:
      - { biome: biome_icecap, when: { height_above: 0.9, height_below: 1 } }
      - { biome: biome_mountain, when: { height_above: 0.46, height_below: 0.9 } }
      - { biome: biome_taiga, when: { moisture_above: 0.49, abs_latitude_above: 0.8, abs_latitude_below: 1 } }
      - { biome: biome_tundra, when: { abs_latitude_above: 0.9, abs_latitude_below: 1 } }
      - { biome: biome_deep_ocean, when: { height_below: 0.01 } }
      - { biome: biome_ocean, when: { height_below: 0.05 } }
      - { biome: biome_coastal, when: { height_below: 0.07 } }
      - { biome: biome_desert, when: { height_below: 0.3, moisture_above: 0, moisture_below: 0.2 } }
      - { biome: biome_forest, when: { height_above: 0.3, height_below: 0.45, moisture_above: 0.5, moisture_below: 0.7 } }
      - { biome: biome_rainforest, when: { height_above: 0.07, height_below: 0.4, moisture_above: 0.6, abs_latitude_below: 0.2 } }
      - { biome: biome_grassland, when: { height_above: 0.07, height_below: 0.3, moisture_above: 0.2, moisture_below: 0.5 } }

  Tropical:
    moisture:
      mode: whittaker
      base_offset: 0
      latitude_factor_divisor: 9
      size_factor_divisor: 100
      random_min: -0.2
      random_max: 0.3
      max_moisture: 2.7
      constant_offset: 0
    rules:
      - { biome: biome_mountain, when: { height_above: 0.7 } }
      - { biome: biome_ocean, when: { height_above: 0, height_below: 0.05 } }
      - { biome: biome_coastal, when: { height_above: 0, height_below: 0.08 } }
      - { biome: biome_desert, when: { moisture_above: 0, moisture_below: 0.15, abs_latitude_above: 0.1, abs_latitude_below: 0.5 } }
      - { biome: biome_rainforest, when: { moisture_above: 0.6, abs_latitude_above: 0, abs_latitude_below: 0.3 } }
      - { biome: biome_forest, when: { moisture_above: 0.35, moisture_below: 0.6, abs_latitude_above: 0.3, abs_latitude_below: 0.6 } }
      - { biome: biome_swamp, when: { height_above: 0.1, height_below: 0.2, moisture_above: 0.15, moisture_below: 0.35, abs_latitude_above: 0.3, abs_latitude_below: 0.6 } }
      - { biome: biome_grassland, when: { height_above: 0.2, height_below: 0.7 } }

  Ocean:
    moisture:
      mode: uniform_random
      random_min: 0.8
      random_max: 1
    rules:
      - { biome: biome_mountain, when: { height_above: 0.85 } }
      - { biome: biome_grassland, when: { height_above: 0.75 } }
      - { biome: biome_coastal, when: { height_above: 0.65 } }
      - { biome: biome_shallow_ocean, when: { height_above: 0.35 } }
      - { biome: biome_deep_ocean, when: {} }

  Cool:
    moisture:
      mode: whittaker
      base_offset: 0
      latitude_factor_divisor: 9
      size_factor_divisor: 100
      random_min: -0.4
      random_max: 0.2
      max_moisture: 2.7
      constant_offset: 0.3
    rules:
      - { biome: biome_icecap, when: { height_above: 0.85 } }
      - { biome: biome_mountain, when: { height_above: 0.65 } }
      - { biome: biome_glacier, when: { height_above: 0.4, abs_latitude_above: 0.6 } }
      - { biome: biome_tundra, when: { height_above: 0.4, abs_latitude_above: 0.4 } }
      - { biome: biome_ocean, when: { height_below: 0.05 } }
      - { biome: biome_coastal, when: { height_below: 0.07 } }
      - { biome: biome_frozen_plain, when: { moisture_below: 0.3 } }
      - { biome: biome_tundra, when: { moisture_below: 0.6 } }
      - { biome: biome_taiga, when: {} }

  Ice:
    moisture:
      mode: uniform_random
      random_min: 0.7
      random_max: 0.9
    rules:
      - { biome: biome_mountain, when: { height_above: 0.8 } }
      - { biome: biome_icecap, when: { height_above: 0.6 } }
      - { biome: biome_glacier, when: { height_above: 0.4 } }
      - { biome: biome_desert, when: { height_above: 0.2, moisture_below: 0.3 } }
      - { biome: biome_tundra, when: { height_above: 0.2 } }
      - { biome: biome_frozen_plain, when: {} }

  Rusted:
    moisture:
      mode: uniform_random
      random_min: 0
      random_max: 0.2
    rules:
      - { biome: biome_rusted_mountain, when: { height_above: 0.8 } }
      - { biome: biome_rusted_desert, when: { height_above: 0.55 } }
      - { biome: biome_rusted_plain, when: { height_above: 0.3 } }
      - { biome: biome_sand_desert, when: { height_above: 0.1 } }
      - { biome: biome_rusted_plain, when: {} }

  Volcanic:
    moisture:
      mode: uniform_random
      random_min: 0
      random_max: 0.1
    rules:
      - { biome: biome_volcanic_peak, when: { height_above: 0.8 } }
      - { biome: biome_obsidian_field, when: { height_above: 0.55 } }
      - { biome: biome_ash_plain, when: { height_above: 0.3 } }
      - { biome: biome_volcanic_plain, when: { height_above: 0.1 } }
      - { biome: biome_lava_ocean, when: {} }

