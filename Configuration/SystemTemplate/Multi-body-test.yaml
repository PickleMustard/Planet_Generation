dominant:
  - type: Star
    name: sol
    template:
      mass: 500000.0
      size: 500
      position: [0.0, 0.0, 0.0]
      velocity: [0.0, 0.0, 0.0]
    central_parameters:
      inclination: 0
      starting_angle: 0
    base_mesh:
      subdivisions: 1
      vertices_per_edge: [[12, 17]]
      num_abberations: 0
      num_deformation_cycles: 0

planetary:
  - type: RockyPlanet
    name: proxima
    template:
      mass: 1000.0
      size: 150
    orbital_parameters:
      apogee: 2500
      perigee: 2000
      starting_angle: 0
      vertical_offset: 0
      orbital_center_index: 0
      parent_body: sol
    base_mesh:
      subdivisions: 2
      vertices_per_edge: [[4, 6], [2, 3]]
      num_abberations: 3
      num_deformation_cycles: 3
    tectonics:
      num_continents: [13, 25]
      stress_scale: [1.1, 1.1]
      shear_scale: [1.1, 1.1]
      max_propagation_distance: [0.01, 0.01]
      propagation_falloff: [0.2, 0.2]
      inactive_stress_threshold: [0.01, 0.01]
      general_height_scale: [0.6, 0.6]
      general_shear_scale: [1.1, 1.1]
      general_compression_scale: [1.2, 1.2]
      general_transform_scale: [1.0, 1.2]
    satellites:
      - type: Moon
        name: luna
        template:
          apogee: 600
          perigee: 400
          starting_angle: 0
          vertical_offset: 0
          mass: 80.0
          size: 40
        base_mesh:
          subdivisions: 1
          vertices_per_edge: [[2, 3]]
          num_abberations: 0
          num_deformation_cycles: 0
        spherical_harmonics_settings:
          amplitude_range: [0.3, 0.7]
        noise_settings:
          amplitude_range: [0.5, 1.2]
          scaling_range: [0.2, 1.7]
          octave_range: [2, 4]

