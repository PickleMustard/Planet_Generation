dominant:
  - type: Star
    name: alpha
    template:
      mass: 500000
      size: 500
      position: [-100, 0, 0]
      velocity: [0, 5, 0]
    central_parameters:
      inclination: 0
      starting_angle: 0
    base_mesh:
      subdivisions: 1
      vertices_per_edge: [[12, 17]]
      num_abberations: 0
      num_deformation_cycles: 0

  - type: Star
    name: beta
    template:
      mass: 500000
      size: 500
      position: [100, 0, 0]
      velocity: [0, -5, 0]
    central_parameters:
      inclination: 0
      starting_angle: 0
    base_mesh:
      subdivisions: 1
      vertices_per_edge: [[12, 17]]
      num_abberations: 0
      num_deformation_cycles: 0

belts:
  - type: AsteroidBelt
    ring_apogee: 8000
    ring_perigee: 250
    ring_velocity: [0, 1, 0]
    size_min: 5
    size_max: 20
    mass_min: 10
    mass_max: 30
    lower_range: 6
    upper_range: 15
    grouping: Balanced
    orbital_center_index: 1

planetary:
  - type: RockyPlanet
    name: terra
    template:
      mass: 1000
      size: 150
    orbital_parameters:
      apogee: 600
      perigee: 200
      starting_angle: 0
      vertical_offset: 0
      orbital_center_index: -1
      parent_body: barycenter
    base_mesh:
      subdivisions: 2
      vertices_per_edge: [[5, 7], [2, 4]]
      num_abberations: 3
      num_deformation_cycles: 3
    tectonics:
      num_continents: [13, 25]
      stress_scale: [1.1, 1.3]
      shear_scale: [1.1, 1.2]
      max_propagation_distance: [0.1, 0.1]
      propagation_falloff: [0.015, 0.02]
      inactive_stress_threshold: [0.01, 0.015]
      general_height_scale: [0.5, 0.5]
      general_shear_scale: [1.0, 1.2]
      general_compression_scale: [1.1, 1.2]
      general_transform_scale: [1.0, 1.2]
    satellites:
      - type: Asteroid
        name: pebble
        template:
          apogee: 500
          perigee: 300
          starting_angle: 0
          vertical_offset: 0
          mass: 20
          size: 10
        base_mesh:
          subdivisions: 1
          vertices_per_edge: [[2, 3]]
          num_abberations: 0
          num_deformation_cycles: 0
        tectonics:
          num_continents: [13, 25]
          stress_scale: [1.1, 1.5]
          shear_scale: [1.1, 1.2]
          max_propagation_distance: [0.13, 0.15]
          propagation_falloff: [0.015, 0.02]
          inactive_stress_threshold: [0.01, 0.015]
          general_height_scale: [0.5, 0.5]
          general_shear_scale: [1.0, 1.2]
          general_compression_scale: [1.1, 1.2]
          general_transform_scale: [1.0, 1.2]
        spherical_harmonics_settings:
          amplitude_range: [0.3, 0.7]
        noise_settings:
          amplitude_range: [0.05, 0.15]
          scaling_range: [0.5, 1.5]
          octave_range: [2, 4]
