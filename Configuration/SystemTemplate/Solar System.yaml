dominant:
  - type: Star
    name: sol
    template:
      mass: 500000
      size: 500
      position: [0, 0, 0]
      velocity: [0, 0, 0]
    central_parameters:
      inclination: 0
      starting_angle: 0
    base_mesh:
      subdivisions: 1
      vertices_per_edge: [[12, 17]]
      num_abberations: 0
      num_deformation_cycles: 0

belts:
  - type: AsteroidBelt
    ring_apogee: 8000
    ring_perigee: 250
    ring_velocity: [0, 1, 0]
    size_min: 5
    size_max: 20
    mass_min: 10
    mass_max: 30
    lower_range: 10
    upper_range: 15
    grouping: Balanced
    orbital_center_index: 0

planetary:
  - type: RockyPlanet
    name: terra
    template:
      mass: 1000
      size: 150
    orbital_parameters:
      apogee: 800
      perigee: 400
      starting_angle: 0
      vertical_offset: 0
      orbital_center_index: 0
      parent_body: sol
    base_mesh:
      subdivisions: 2
      vertices_per_edge: [[5, 7], [3, 5]]
      num_abberations: 6
      num_deformation_cycles: 6
    tectonics:
      num_continents: [25, 47]
      stress_scale: [3.0, 8.0]
      shear_scale: [0.2, 1.7]
      max_propagation_distance: [0.01, 0.1]
      propagation_falloff: [0.8, 1.5]
      inactive_stress_threshold: [0.01, 0.5]
      general_height_scale: [0.8, 1.2]
      general_shear_scale: [0.8, 1.2]
      general_compression_scale: [20.0, 40.0]
      general_transform_scale: [1.1, 1.4]
    satellites:
      - type: Moon
        name: luna
        template:
          apogee: 200
          perigee: 100
          starting_angle: 0
          vertical_offset: 0
          mass: 80
          size: 40
        base_mesh:
          subdivisions: 1
          vertices_per_edge: [[3, 5]]
          num_abberations: 0
          num_deformation_cycles: 0
        spherical_harmonics_settings:
          amplitude_range: [0.3, 0.7]
        noise_settings:
          amplitude_range: [0.5, 1.2]
          scaling_range: [0.2, 1.7]
          octave_range: [2, 4]
      - type: Moon
        name: selene
        template:
          apogee: 200
          perigee: 100
          starting_angle: 180
          vertical_offset: 0
          mass: 80
          size: 40
        base_mesh:
          subdivisions: 1
          vertices_per_edge: [[3, 5]]
          num_abberations: 0
          num_deformation_cycles: 0
        spherical_harmonics_settings:
          amplitude_range: [0.3, 0.7]
        noise_settings:
          amplitude_range: [0.5, 1.2]
          scaling_range: [0.2, 1.7]
          octave_range: [2, 4]

  - type: GasGiant
    name: jupiter
    template:
      mass: 17000
      size: 350
    orbital_parameters:
      apogee: 1400
      perigee: 700
      starting_angle: 90
      vertical_offset: 0
      orbital_center_index: 0
      parent_body: sol
    base_mesh:
      subdivisions: 1
      vertices_per_edge: [[8, 12]]
      num_abberations: 2
      num_deformation_cycles: 2
    tectonics:
      num_continents: [3, 8]
      stress_scale: [1.0, 2.0]
      shear_scale: [0.5, 1.5]
      max_propagation_distance: [0.02, 0.08]
      propagation_falloff: [1.0, 2.0]
      inactive_stress_threshold: [0.02, 0.08]
      general_height_scale: [0.9, 1.1]
      general_shear_scale: [0.9, 1.1]
      general_compression_scale: [1.2, 1.8]
      general_transform_scale: [1.0, 1.3]
