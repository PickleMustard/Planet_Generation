bodies:
  - type: Star
    position: [0, 0, 0]
    velocity: [0, 0, 0]
    mass: 500000
    size: 500

    mesh:
      base_mesh:
        subdivisions: 1
        vertices_per_edge: [12, 17]
        num_abberations: 0
        num_deformation_cycles: 0

      tectonic:
        num_continents: [1, 2]
        stress_scale: [0.8, 3.0]
        shear_scale: [0.2, 1.7]
        max_propagation_distance: [0.01, 0.1]
        propagation_falloff: [0.8, 1.5]
        inactive_stress_threshold: [0.01, 0.1]
        general_height_scale: [0.8, 1.2]
        general_shear_scale: [0.8, 1.2]
        general_compression_scale: [1.0, 1.75]
        general_transform_scale: [1.1, 1.4]

    satellites:
      - type: Asteroid Belt
        template:
          number_asteroids: [10, 15]
          grouping: balanced
          apogee: 8000
          perigee: 250
          ring_velocity: [0, 1, 0]
          size_range: [5, 20]
          possible_subtypes:
            - planet
            - asteroid

  - type: RockyPlanet
    apogee: 800
    perigee: 400
    starting_angle: 0
    vertical_offset: 0
    mass: 1000
    size: 150

    mesh:
      base_mesh:
        subdivisions: 2
        vertices_per_edge: [5, 7]
        num_abberations: 6
        num_deformation_cycles: 6

      tectonic:
        num_continents: [25, 47]
        stress_scale: [3.0, 8.0]
        shear_scale: [0.2, 1.7]
        max_propagation_distance: [0.01, 0.1]
        propagation_falloff: [0.8, 1.5]
        inactive_stress_threshold: [0.01, 0.5]
        general_height_scale: [0.8, 1.2]
        general_shear_scale: [0.8, 1.2]
        general_compression_scale: [20.0, 40.0]
        general_transform_scale: [1.1, 1.4]

    satellites:
      - type: Moon
        apogee: 200
        perigee: 100
        starting_angle: 0
        vertical_offset: 0
        mass: 80
        size: 40

        mesh:
          base_mesh:
            subdivisions: 1
            vertices_per_edge: [3, 5]
            num_abberations: 0
            num_deformation_cycles: 0

          spherical_harmonics:
            amplitude_range: [0.3, 0.7]

          noise_settings:
            amplitude_range: [0.5, 1.2]
            scaling_range: [0.2, 1.7]
            octave_range: [2, 4]
            lacunarity: 5.0
            gain: 4.5

      - type: Moon
        apogee: 200
        perigee: 100
        starting_angle: 180
        vertical_offset: 0
        mass: 80
        size: 40

        mesh:
          base_mesh:
            subdivisions: 1
            vertices_per_edge: [3, 5]
            num_abberations: 0
            num_deformation_cycles: 0

          spherical_harmonics:
            amplitude_range: [0.3, 0.7]

          noise_settings:
            amplitude_range: [0.5, 1.2]
            scaling_range: [0.2, 1.7]
            octave_range: [2, 4]
            lacunarity: 5.0
            gain: 4.5

  - type: GasGiant
    apogee: 1400
    perigee: 700
    starting_angle: 90
    vertical_offset: 0
    mass: 17000
    size: 350

    mesh:
      base_mesh:
        subdivisions: 1
        vertices_per_edge: [8, 12]
        num_abberations: 2
        num_deformation_cycles: 2

      tectonic:
        num_continents: [3, 8]
        stress_scale: [1.0, 2.0]
        shear_scale: [0.5, 1.5]
        max_propagation_distance: [0.02, 0.08]
        propagation_falloff: [1.0, 2.0]
        inactive_stress_threshold: [0.02, 0.08]
        general_height_scale: [0.9, 1.1]
        general_shear_scale: [0.9, 1.1]
        general_compression_scale: [1.2, 1.8]
        general_transform_scale: [1.0, 1.3]
