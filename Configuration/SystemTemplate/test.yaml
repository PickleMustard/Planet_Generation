bodies:
  - type: BlackHole
    position: [0.0, 0.0, 0.0]
    velocity: [0.0, 0.0, 0.0]
    mass: 1000000.0
    size: 50

    mesh:
      base_mesh:
        subdivisions: 1
        vertices_per_edge: [[5, 12]]
        num_abberations: 1
        num_deformation_cycles: 1

      tectonic:
        num_continents: [0, 1]
        stress_scale: [1.0, 5.0]
        shear_scale: [0.5, 2.0]
        max_propagation_distance: [0.02, 0.2]
        propagation_falloff: [0.5, 1.0]
        inactive_stress_threshold: [0.02, 0.2]
        general_height_scale: [0.5, 1.5]
        general_shear_scale: [0.5, 1.5]
        general_compression_scale: [1.5, 2.5]
        general_transform_scale: [1.2, 1.8]

    satellites:
      - type: Asteroid Belt
        template:
          number_asteroids: [6, 15]
          grouping: Balanced
          apogee: 8000.0
          perigee: 250.0
          ring_velocity: [0.0, 1.0, 0.0]
          size_range: [5.0, 15.0]
          mass_range: [10.0, 30.0]

  - type: RockyPlanet
    apogee: 500
    perigee: 150
    starting_angle: 0
    vertical_offset: 0
    mass: 1000.0
    size: 150

    mesh:
      base_mesh:
        subdivisions: 2
        vertices_per_edge: [[4, 6], [2, 3]]
        num_abberations: 3
        num_deformation_cycles: 3

      tectonic:
        num_continents: [13, 25]
        stress_scale: [1.1, 1.1]
        shear_scale: [1.1, 1.1]
        max_propagation_distance: [0.01, 0.01]
        propagation_falloff: [0.2, 0.2]
        inactive_stress_threshold: [0.01, 0.01]
        general_height_scale: [0.6, 0.6]
        general_shear_scale: [1.1, 1.1]
        general_compression_scale: [1.2, 1.2]
        general_transform_scale: [1.0, 1.2]

    satellites:
      - type: Asteroid
        apogee: 500
        perigee: 300
        starting_angle: 0
        vertical_offset: 0
        mass: 20.0
        size: 10

        mesh:
          base_mesh:
            subdivisions: 1
            vertices_per_edge: [[2, 3]]
            num_abberations: 0
            num_deformation_cycles: 0

          spherical_harmonics:
            amplitude_range: [0.3, 0.7]

          noise_settings:
            amplitude_range: [0.05, 0.15]
            scaling_range: [0.5, 1.5]
            octave_range: [2, 4]
            lacunarity: 2.0
            gain: 0.5
