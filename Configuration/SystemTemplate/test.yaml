bodies:
  - type: BlackHole
    celestial:
      template:
        position: [0.0, 0.0, 0.0]
        velocity: [0.0, 0.0, 0.0]
        mass: 1000000.0
        size: 10

      mesh:
        base_mesh:
          subdivisions: 1
          vertices_per_edge: [[5, 12]]
          num_abberations: 1
          num_deformation_cycles: 1

        tectonic:
          num_continents: [0, 1]
          stress_scale: [1.0, 5.0]
          shear_scale: [0.5, 2.0]
          max_propagation_distance: [0.02, 0.2]
          propagation_falloff: [0.5, 1.0]
          inactive_stress_threshold: [0.02, 0.2]
          general_height_scale: [0.5, 1.5]
          general_shear_scale: [0.5, 1.5]
          general_compression_scale: [1.5, 2.5]
          general_transform_scale: [1.2, 1.8]

      satellites:
        - type: AsteroidBelt
          template:
            ring_apogee: 8000.0
            ring_perigee: 250.0
            ring_velocity: [0.0, 2.0, 0.0]
            lower_range: 6
            upper_range: 15
            grouping: Balanced
            mass_min: 1.0
            mass_max: 10.0
            size_min: 1.0
            size_max: 5.0

  - type: RockyPlanet
    celestial:
      template:
        position: [150.0, 0.0, 0.0]
        velocity: [0.0, 0.0, 0.0]
        mass: 100.0
        size: 50

      mesh:
        base_mesh:
          subdivisions: 2
          vertices_per_edge: [[4, 6], [2, 3]]
          num_abberations: 3
          num_deformation_cycles: 3

        tectonic:
          num_continents: [13, 25]
          stress_scale: [1.1, 1.1]
          shear_scale: [1.1, 1.1]
          max_propagation_distance: [0.01, 0.01]
          propagation_falloff: [0.2, 0.2]
          inactive_stress_threshold: [0.01, 0.01]
          general_height_scale: [0.6, 0.6]
          general_shear_scale: [1.1, 1.1]
          general_compression_scale: [1.2, 1.2]
          general_transform_scale: [1.0, 1.2]

      satellites:
        - type: Asteroid
          template:
            position: [450.0, 0.0, 0.0]
            velocity: [0.0, 2.0, 0.0]
            mass: 4.0
            size: 10

          mesh:
            base_mesh:
              subdivisions: 1
              vertices_per_edge: [[2, 3]]
              num_abberations: 0
              num_deformation_cycles: 0

            scaling:
              scaling_range_x: [1.0, 1.2]
              scaling_range_y: [1.0, 1.2]
              scaling_range_z: [1.0, 1.2]

            noise_settings:
              amplitude_range: [5.0, 5.0]
              scaling_range: [5.0, 5.0]
              octave_range: [4, 8]
