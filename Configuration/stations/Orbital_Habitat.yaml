stations:
  - name: Small_Habitat
    station_type: Orbital_Habitat
    construction_time: 30
    behaviors:
      - behavior_id: StorageHubBehavior
        storage_capacity: "40"
    required_resources:
      steel: 500
      pcb: 100
    icon:
      base_path: "res://Assets/Icons/Stations/habitat/small_habitat"

  - name: Medium_Habitat
    station_type: Orbital_Habitat
    construction_time: 90
    behaviors:
      - behavior_id: StorageHubBehavior
        storage_capacity: "40"
    required_resources:
      steel: 1
      motor: 1
      kevlar: 1
    icon:
      base_path: "res://Assets/Icons/Stations/habitat/medium_habitat"

  - name: Large_Habitat
    station_type: Orbital_Habitat
    construction_time: 180
    behaviors:
      - behavior_id: StorageHubBehavior
        storage_capacity: "40"
    required_resources:
      Steel: 8000
      Electronics: 2000
      Composites: 1500
      LifeSupport: 500
    icon:
      base_path: "res://Assets/Icons/Stations/habitat/large_habitat"
