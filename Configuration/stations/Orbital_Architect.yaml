stations:
  - name: Small_Orbital_Architect
    station_type: Orbital_Architect
    construction_time: 45
    behaviors:
      - behavior_id: StorageHubBehavior
        storage_capacity: "10"
      - behavior_id: OrbitalConstructorBehavior
        work_budget_per_tick: "1.0"
        regular_slots: "1"
        overtime_slots: "1"
        overtime_cost_percent: "0.10"
    required_resources:
      glass: 100
      steel: 100
      ceramics: 20
      low_voltage_wire: 30
    icon:
      resource: "res://Materials/Icons/default_station.tres"

  - name: Large_Orbital_Architect
    station_type: Orbital_Architect
    construction_time: 120
    behaviors:
      - behavior_id: StorageHubBehavior
        storage_capacity: "10"
      - behavior_id: OrbitalConstructorBehavior
        work_budget_per_tick: "3.0"
        regular_slots: "3"
        overtime_slots: "2"
        overtime_cost_percent: "0.10"
    required_resources:
      steel: 150
      high_tensile_wire: 200
      motor: 100
    icon:
      resource: "res://Materials/Icons/default_station.tres"

  - name: industrial_construction_ring
    station_type: Orbital_Architect
    construction_time: 500
    behaviors:
      - behavior_id: StorageHubBehavior
        storage_capacity: "10"
      - behavior_id: OrbitalConstructorBehavior
        work_budget_per_tick: "10.0"
        regular_slots: "6"
        overtime_slots: "4"
        overtime_cost_percent: "0.10"
    required_resources:
      stradium: 5000
      microchip: 1000
      high_tensile_wire: 10000
      hydrazine: 100
      motor: 100
    icon:
      resource: "res://Materials/Icons/default_station.tres"
