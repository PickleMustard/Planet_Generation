        max_parallel_ship_builds: "3"
        work_per_tick: "1"
    required_resources:
      Steel: 5000
      Electronics: 1500
      Machinery: 1000
      Composites: 500
    icon:
      base_path: "res://Assets/Icons/Stations/shipyard/large_shipyard"
