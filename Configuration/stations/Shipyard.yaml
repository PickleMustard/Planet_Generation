stations:
  - name: small_vaccdock
    description: The smallest available commercial ship docks. They're about as barebones as they go. No gravity, no atmosphere, little capacity.
    station_type: Shipyard
    construction_time: 120
    behaviors:
      - behavior_id: StorageHubBehavior
        storage_capacity: "8"
      - behavior_id: ShipyardBehavior
        max_parallel_ship_builds: "1"
        work_per_tick: "1"
    required_resources:
      aluminum: 40
      steel: 20
      solar_cell: 5
    icon:
      resource: "res://Materials/Icons/default_station.tres"

  - name: triple_vaccdock
    description: A marked improvement over the small vaccdock, the improved infrastructure allows more and bigger ships to be constructed. Worker safety was a priority in its design, cutting mortalities by 5% from its predecessor.
    station_type: Shipyard
    construction_time: 240
    behaviors:
      - behavior_id: StorageHubBehavior
        storage_capacity: "20"
      - behavior_id: ShipyardBehavior
        max_parallel_ship_builds: "3"
        work_per_tick: "1"
    required_resources:
      ceramics: 200
      solar_cell: 50
      tungsten: 200
      titanium: 200
    icon:
      resource: "res://Materials/Icons/default_station.tres"
