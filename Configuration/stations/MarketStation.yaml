stations:
  - name: mercums_station
    station_type: Market
    construction_time: 90
    behaviors:
      - behavior_id: MarketStationBehavior
        ship_level_limit: "1"
        max_held_ships: "1"
        base_hold_time: "600"
        to_market_speed_modifier: "1.0"
        from_market_speed_modifier: "1.0"
    required_resources:
      steel: 100
      aluminum: 100
      ceramics: 80
      low_voltage_wire: 32
    icon:
      base_path: "res://Assets/Icons/Stations/market/small_market"

  - name: industrial_mercums_station
    station_type: Market
    construction_time: 200
    behaviors:
      - behavior_id: MarketStationBehavior
        ship_level_limit: "3"
        max_held_ships: "4"
        base_hold_time: "600"
        to_market_speed_modifier: "0.85"
        from_market_speed_modifier: "0.85"
        modifiers: System.Collections.Generic.List`1[System.Object]
    required_resources:
      titanium: 250
      tungsten: 100
      high_tensile_wire: 150
      high_voltage_wire: 75
      motor: 40
    icon:
      base_path: "res://Assets/Icons/Stations/market/large_market"
