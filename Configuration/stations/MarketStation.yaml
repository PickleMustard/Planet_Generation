stations:
  - name: mercums_station
    description: The wormhole technology used by this station was first pioneered by Anthony Mercums. It revolutionized  intersystem trading, making the Mercum Corporation wealthy in the process.
    station_type: Market
    construction_time: 90
    behaviors:
      - behavior_id: MarketStationBehavior
        ship_level_limit: "1"
        max_held_ships: "1"
        base_hold_time: "600"
        to_market_speed_modifier: "1.0"
        from_market_speed_modifier: "1.0"
      - StorageHubBehavior
    required_resources:
      steel: 100
      aluminum: 100
      ceramics: 80
      low_voltage_wire: 32
    icon:
      resource: "res://Materials/Icons/default_station.tres"

  - name: industrial_mercums_station
    description: As the mercantile traffic through systems grew, the capacity of the Mercums Station became a bottleneck. The Industrial Mercums Station was the Mercums Corporations answer to the problem. It was tailored to moving the slow, bulk cargo carriers that had become dominant throughout Human Occupied Space.
    station_type: Market
    construction_time: 200
    behaviors:
      - behavior_id: MarketStationBehavior
        ship_level_limit: "3"
        max_held_ships: "4"
        base_hold_time: "600"
        to_market_speed_modifier: "0.85"
        from_market_speed_modifier: "0.85"
        modifiers: System.Collections.Generic.List`1[System.Object]
    required_resources:
      titanium: 250
      tungsten: 100
      high_tensile_wire: 150
      high_voltage_wire: 75
      motor: 40
    icon:
      resource: "res://Materials/Icons/default_station.tres"
