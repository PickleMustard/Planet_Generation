stations:
  - name: Small_Market
    station_type: Market
    construction_time: 90
    behaviors:
      - behavior_id: MarketStationBehavior
        ship_level_limit: "1"
        max_held_ships: "1"
        # base_hold_time is in manufacture ticks (60Hz). Total hold scales with cargo:
        #   sell = (base/2) * sellUnits * to_market_speed_modifier
        #   buy  = (base/2) * buyUnits  * from_market_speed_modifier
        base_hold_time: "600"
        to_market_speed_modifier: "1.0"
        from_market_speed_modifier: "1.0"
    required_resources:
      Steel: 1500
      Electronics: 400
      Machinery: 300
    icon:
      base_path: "res://Assets/Icons/Stations/market/small_market"

  - name: Large_Market
    station_type: Market
    construction_time: 200
    behaviors:
      - behavior_id: MarketStationBehavior
        ship_level_limit: "3"
        max_held_ships: "4"
        base_hold_time: "600"
        to_market_speed_modifier: "0.85"
        from_market_speed_modifier: "0.85"
        # Stackable modifiers fold onto the base values (additive deltas first, then multiplicative
        # factors). Speed factors lower = faster; sell_price > 1 sells for more; buy_price < 1 buys
        # for less.
        modifiers:
          - type: multiplicative
            source: WormholeBrokerage
            sell_price: "1.1"
            buy_price: "0.95"
    required_resources:
      Steel: 9000
      Electronics: 2500
      Machinery: 1500
      Composites: 800
    icon:
      base_path: "res://Assets/Icons/Stations/market/large_market"
