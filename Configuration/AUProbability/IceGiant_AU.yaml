schema_version: 1.0
body_type: IceGiant
description: "AU-based probability distribution for IceGiant subtypes"
max_considered_au: 100.0
range_overlap_policy: "use_first"

au_ranges:
  - range:
      min_au: 0.0
      max_au: 5.0
      exclusive_max: false
    name: "inner_zone"
    subtype_distribution:
      - subtype: StandardNeptune
        weight: 0.4
      - subtype: MethaneGiant
        weight: 0.3
      - subtype: ToxicGiant
        weight: 0.3

  - range:
      min_au: 5.0
      max_au: 20.0
      exclusive_max: false
    name: "standard_zone"
    subtype_distribution:
      - subtype: StandardNeptune
        weight: 0.3
      - subtype: UranusType
        weight: 0.25
      - subtype: MethaneGiant
        weight: 0.2
      - subtype: AmmoniaGiant
        weight: 0.15
      - subtype: SilverGiant
        weight: 0.1

  - range:
      min_au: 20.0
      max_au: 100.0
      exclusive_max: false
    name: "outer_zone"
    subtype_distribution:
      - subtype: Cryovolcanic
        weight: 0.3
      - subtype: AmmoniaGiant
        weight: 0.3
      - subtype: UranusType
        weight: 0.2
      - subtype: SilverGiant
        weight: 0.2

default_subtype: StandardNeptune
