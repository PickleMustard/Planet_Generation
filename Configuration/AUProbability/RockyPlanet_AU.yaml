schema_version: 1.0
body_type: RockyPlanet
description: "AU-based probability distribution for RockyPlanet subtypes"
max_considered_au: 100.0
range_overlap_policy: "use_first"

au_ranges:
  - range:
      min_au: 0.0
      max_au: 0.5
      exclusive_max: false
    name: "inner_scorched"
    subtype_distribution:
      - subtype: Scoured
        weight: 0.8
        required_biomes: ["StoneDesert", "SandDesert", "Mountain"]
      - subtype: Volcanic
        weight: 0.2
        required_biomes: ["Mountain", "Desert"]

  - range:
      min_au: 0.5
      max_au: 0.8
      exclusive_max: false
    name: "hot_rocky"
    subtype_distribution:
      - subtype: Desert
        weight: 0.6
        required_biomes: ["SandDesert", "StoneDesert"]
      - subtype: Scoured
        weight: 0.3
        required_biomes: ["StoneDesert", "SandDesert", "Mountain"]
      - subtype: Rusted
        weight: 0.1
        required_biomes: ["RustedPlain", "RustedDesert", "RustedMountain"]

  - range:
      min_au: 0.8
      max_au: 1.2
      exclusive_max: false
    name: "temperate_zone"
    subtype_distribution:
      - subtype: Temperate
        weight: 0.6
        required_biomes: ["Forest", "Grassland", "Coastal", "Ocean"]
      - subtype: Ocean
        weight: 0.2
        required_biomes: ["Ocean", "Coastal"]
      - subtype: Tropical
        weight: 0.2
        required_biomes: ["Rainforest", "Forest", "Coastal"]

  - range:
      min_au: 1.2
      max_au: 2.5
      exclusive_max: false
    name: "cool_rocky"
    subtype_distribution:
      - subtype: Ice
        weight: 0.5
        required_biomes: ["Icecap", "Glacier", "FrozenPlain"]
      - subtype: Temperate
        weight: 0.3
        required_biomes: ["Forest", "Grassland", "Taiga"]
      - subtype: Rusted
        weight: 0.2
        required_biomes: ["RustedPlain", "RustedDesert"]

  - range:
      min_au: 2.5
      max_au: 100.0
      exclusive_max: false
    name: "outer_frozen"
    subtype_distribution:
      - subtype: Ice
        weight: 0.9
        required_biomes: ["Icecap", "Glacier", "FrozenPlain"]
      - subtype: Rusted
        weight: 0.1
        required_biomes: ["RustedPlain", "RustedDesert"]

default_subtype: Temperate
