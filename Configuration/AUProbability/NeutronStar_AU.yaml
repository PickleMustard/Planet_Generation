schema_version: 1.0
body_type: NeutronStar
description: "Equal probability distribution for NeutronStar subtypes"
max_considered_au: 100.0
range_overlap_policy: "use_first"

au_ranges:
  - range:
      min_au: 0.0
      max_au: 100.0
      exclusive_max: false
    name: "all_distances"
    subtype_distribution:
      - subtype: Pulsar
        weight: 0.2
      - subtype: Magnetar
        weight: 0.2
      - subtype: Isolated
        weight: 0.15
      - subtype: Binary
        weight: 0.15
      - subtype: Millisecond
        weight: 0.15
      - subtype: XRayPulsar
        weight: 0.15

default_subtype: Pulsar
