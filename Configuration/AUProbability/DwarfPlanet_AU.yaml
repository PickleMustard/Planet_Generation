schema_version: 1.0
body_type: DwarfPlanet
description: "AU-based probability distribution for DwarfPlanet subtypes"
max_considered_au: 100.0
range_overlap_policy: "use_first"

au_ranges:
  - range:
      min_au: 0.0
      max_au: 3.0
      exclusive_max: false
    name: "inner_belt"
    subtype_distribution:
      - subtype: CeresType
        weight: 0.5
      - subtype: RockyBelt
        weight: 0.3
      - subtype: MixedComposition
        weight: 0.2

  - range:
      min_au: 3.0
      max_au: 30.0
      exclusive_max: false
    name: "kuiper_zone"
    subtype_distribution:
      - subtype: IcyKuiper
        weight: 0.4
      - subtype: Plutoid
        weight: 0.3
      - subtype: MixedComposition
        weight: 0.2
      - subtype: RockyBelt
        weight: 0.1

  - range:
      min_au: 30.0
      max_au: 100.0
      exclusive_max: false
    name: "scattered_zone"
    subtype_distribution:
      - subtype: ScatteredDisk
        weight: 0.4
      - subtype: DetachedObject
        weight: 0.3
      - subtype: IcyKuiper
        weight: 0.3

default_subtype: IcyKuiper
