schema_version: 1.0
body_type: Satellite
description: "AU-based probability for satellite subtypes relative to parent body"
max_considered_au: 100.0
range_overlap_policy: "use_first"

parent_body_influence:
  RockyPlanet:
    au_ranges:
      - range:
          min_au: 0.0
          max_au: 0.01
        name: "close_rocky"
        subtype_distribution:
          - subtype: RockyMoon
            weight: 0.9
          - subtype: CapturedAsteroid
            weight: 0.1
      - range:
          min_au: 0.01
          max_au: 0.1
        name: "mid_rocky"
        subtype_distribution:
          - subtype: RockyMoon
            weight: 0.6
          - subtype: IcyMoon
            weight: 0.4
      - range:
          min_au: 0.1
          max_au: 100.0
        name: "far_rocky"
        subtype_distribution:
          - subtype: IcyMoon
            weight: 0.7
          - subtype: TidallyLocked
            weight: 0.3

  GasGiant:
    au_ranges:
      - range:
          min_au: 0.0
          max_au: 0.05
        name: "close_gas"
        subtype_distribution:
          - subtype: VolcanicMoon
            weight: 0.7
          - subtype: RockyMoon
            weight: 0.3
      - range:
          min_au: 0.05
          max_au: 0.2
        name: "mid_gas"
        subtype_distribution:
          - subtype: IcyMoon
            weight: 0.8
          - subtype: RockyMoon
            weight: 0.2
      - range:
          min_au: 0.2
          max_au: 100.0
        name: "far_gas"
        subtype_distribution:
          - subtype: IcyMoon
            weight: 0.5
          - subtype: CapturedAsteroid
            weight: 0.3
          - subtype: TidallyLocked
            weight: 0.2

  IceGiant:
    au_ranges:
      - range:
          min_au: 0.0
          max_au: 0.1
        name: "close_ice"
        subtype_distribution:
          - subtype: IcyMoon
            weight: 0.9
          - subtype: CapturedAsteroid
            weight: 0.1
      - range:
          min_au: 0.1
          max_au: 100.0
        name: "far_ice"
        subtype_distribution:
          - subtype: IcyMoon
            weight: 0.6
          - subtype: CapturedAsteroid
            weight: 0.4

default:
  au_ranges:
    - range:
        min_au: 0.0
        max_au: 100.0
      name: "default_satellite"
      subtype_distribution:
        - subtype: RockyMoon
          weight: 1.0
