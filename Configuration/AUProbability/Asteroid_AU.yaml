schema_version: 1.0
body_type: Asteroid
description: "1D asteroid subtype distribution. Asteroids are largely composition-driven, so the AU axis is intentionally flat for now."
max_considered_au: 100.0
range_overlap_policy: "use_first"
default_subtype: Carbonaceous

au_ranges:
  - range: { min_au: 0.0, max_au: 100.0 }
    name: any
    subtype_distribution:
      - { subtype: Silicate, weight: 0.4 }
      - { subtype: Carbonaceous, weight: 0.35 }
      - { subtype: Metallic, weight: 0.15 }
      - { subtype: IceAsteroid, weight: 0.1 }

parent_subtype_modifiers: {}
