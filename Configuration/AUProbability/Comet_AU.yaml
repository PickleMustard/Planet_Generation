schema_version: 1.0
body_type: Comet
description: "1D comet subtype distribution. Period class is largely orbit-driven, so the AU axis is intentionally flat for now."
max_considered_au: 100.0
range_overlap_policy: "use_first"
default_subtype: ShortPeriod

au_ranges:
  - range: { min_au: 0.0, max_au: 100.0 }
    name: any
    subtype_distribution:
      - { subtype: ShortPeriod, weight: 0.4 }
      - { subtype: LongPeriod, weight: 0.3 }
      - { subtype: HalleyType, weight: 0.2 }
      - { subtype: EnckeType, weight: 0.1 }

parent_subtype_modifiers: {}
