schema_version: 1.0
body_type: Star
description: "Equal probability distribution for Star subtypes"
max_considered_au: 100.0
range_overlap_policy: "use_first"

au_ranges:
  - range:
      min_au: 0.0
      max_au: 100.0
      exclusive_max: false
    name: "all_distances"
    subtype_distribution:
      - subtype: MainSequence
        weight: 0.125
      - subtype: RedGiant
        weight: 0.125
      - subtype: WhiteDwarf
        weight: 0.125
      - subtype: RedDwarf
        weight: 0.125
      - subtype: BlueSupergiant
        weight: 0.125
      - subtype: YellowDwarf
        weight: 0.125
      - subtype: BinaryPrimary
        weight: 0.125
      - subtype: VariableStar
        weight: 0.125

default_subtype: MainSequence
