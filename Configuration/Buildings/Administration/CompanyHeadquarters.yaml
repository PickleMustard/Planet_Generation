buildings:
  - id_name: company_headquarters
    display_name: Company Headquarters
    description: The nerve center of your interstellar enterprise. Provides power, storage, extraction, and basic manufacturing capabilities.
    category: administration
    building_limit: 1
    building_time: 0
    work_required: 0
    demolishable: false

    # Only headquarters-specific recipes allowed
    allowed_recipe_category: headquarters

    placement_requirements:
      biomes: ["*"]
      min_elevation: 0.0
      max_elevation: 1.0
      max_slope: 90.0
      cell_count: 4
      requires_adjacent: true

    required_resources: {}

    production:
      default_recipe: "hq_all_in_one_operation"
      alternative_recipes:
        ["hq_power_focus", "hq_extraction_focus", "hq_fabrication_focus"]
      production_speed: 1.0

    # Starting resources - data driven
    starting_stockpiles:
      concrete: 100
      iron: 50
      copper: 30
      water: 200
      grain: 50

    # Bulk storage: total slot count, allocated across the filter mix below.
    # Any leftover slots default to "any". Slot capacity = the occupant's max_stack_size.
    storage_capacity: 30
    slot_filters:
      any: 12
      category:ore: 3
      category:raw_material: 3
      category:fuel: 3
      category:food: 3
      category:construction: 3
      category:industrial: 3

    # Composed behaviors (per-tick capabilities)
    # Order matters: StorageHubBehavior must register before InitialStockpileBehavior
    # so BulkStorage slots exist when the stockpile is deposited.
    behaviors:
      - StorageHubBehavior
      - TransferStationBehavior
      - TransportHubBehavior
      - InitialStockpileBehavior
      - ManufacturingBehavior
      - GameStartBehavior

    # HQ uses Flex nodes so the player can wire it as either source or sink.
    nodes:
      - side: north
        kind: flex
      - side: south
        kind: flex
      - side: east
        kind: flex
      - side: west
        kind: flex

    # Headquarters doubles as a starter transfer station
    transfer_station:
      cargo_capacity: 500.0
      vehicle_speed: 50.0
      max_concurrent_transfers: 2

    visual:
      model_path: "res://Models/Buildings/headquarters.glb" # Placeholder - uses fallback box mesh
      scale: 2.0
      rotation_offset: [0, 0, 0]

    icon:
      base_path: "res://Assets/Icons/Buildings/headquarters/company_headquarters"
