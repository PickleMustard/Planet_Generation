buildings:
  - id_name: power_plant
    display_name: Fusion Power Plant
    description: Compact fusion reactor providing clean, high-output energy for colony operations and industrial facilities.
    category: power
    building_time: 9000.0  # 2.5 hours in seconds
    work_required: 1500.0
    
    placement_requirements:
      biomes: [Grassland, Forest, StoneDesert, RustedPlain]
      min_elevation: 0.2
      max_elevation: 0.8
      max_slope: 10.0
      cell_count: 9  # 3x3 grid
      requires_adjacent: true
    
    required_resources:
      steel: 500
      titanium: 300
      copper: 400
      electronics: 200
      uranium: 50
      water: 1000
    
    production:
      extraction_rate: 0.0
      resources: [electricity, heat, hydrogen]
      recipes: [fusion_reaction, energy_distribution, coolant_management]
    
    visual:
      model_path: "res://Models/Buildings/power_plant.glb"
      scale: 2.0
      rotation_offset: [0, 0, 0]
  
  - id_name: solar_array
    display_name: Solar Power Array
    description: Large-scale photovoltaic array with tracking systems for maximum solar energy capture.
    category: power
    building_time: 3600.0  # 1 hour in seconds
    work_required: 600.0
    
    placement_requirements:
      biomes: [Desert, StoneDesert, RustedDesert, Grassland]
      min_elevation: 0.1
      max_elevation: 0.7
      max_slope: 5.0
      cell_count: 4  # 2x2 grid
      requires_adjacent: true
    
    required_resources:
      silicon: 200
      aluminum: 150
      copper: 100
      glass: 100
      electronics: 50
    
    production:
      extraction_rate: 0.0
      resources: [electricity]
      recipes: [solar_tracking, energy_storage, panel_cleaning]
    
    visual:
      model_path: "res://Models/Buildings/solar_array.glb"
      scale: 1.5
      rotation_offset: [0, 0, 0]
  
  - id_name: wind_turbine
    display_name: Wind Turbine Farm
    description: Cluster of high-efficiency wind turbines for harnessing atmospheric energy flows.
    category: power
    building_time: 4200.0  # 1.17 hours in seconds
    work_required: 700.0
    
    placement_requirements:
      biomes: [Coastal, Mountain, Plain, Grassland]
      min_elevation: 0.3
      max_elevation: 0.9
      max_slope: 25.0
      cell_count: 1
      requires_adjacent: false
    
    required_resources:
      steel: 100
      aluminum: 80
      copper: 60
      composites: 40
      electronics: 30
    
    production:
      extraction_rate: 0.0
      resources: [electricity]
      recipes: [wind_analysis, turbine_maintenance, grid_synchronization]
    
    visual:
      model_path: "res://Models/Buildings/wind_turbine.glb"
      scale: 1.0
      rotation_offset: [0, 0, 0]
  
  - id_name: geothermal_plant
    display_name: Geothermal Power Plant
    description: Taps into planetary heat for consistent, reliable energy generation with minimal environmental impact.
    category: power
    building_time: 6600.0  # 1.83 hours in seconds
    work_required: 1100.0
    
    placement_requirements:
      biomes: [Volcanic, Mountain, RustedMountain, StoneDesert]
      min_elevation: 0.4
      max_elevation: 1.0
      max_slope: 15.0
      cell_count: 2
      requires_adjacent: false
    
    required_resources:
      steel: 300
      titanium: 200
      copper: 150
      ceramics: 100
      water: 400
    
    production:
      extraction_rate: 0.0
      resources: [electricity, heat, steam]
      recipes: [geothermal_drilling, heat_exchange, steam_management]
    
    visual:
      model_path: "res://Models/Buildings/geothermal_plant.glb"
      scale: 1.4
      rotation_offset: [0, 0, 0]