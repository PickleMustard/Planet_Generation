buildings:
  - id_name: fusion_reactor
    display_name: Fusion Power Plant
    description: Compact fusion reactor providing clean, high-output energy for colony operations and industrial facilities.
    category: power
    building_time: 900.0
    work_required: 150.0

    placement_requirements:
      biomes: ["*"]
      min_elevation: 0.2
      max_elevation: 0.8
      max_slope: 10.0
      cell_count: 9 # 3x3 grid
      requires_adjacent: true

    required_resources:
      steel: 500
      titanium: 300
      copper: 400
      electronics: 200
      water: 1000

    production:
      default_recipe: "tritium_fusion"
      alternative_recipes: ["hydrogen_fusion"]
      production_speed: 5

    power:
      grid_radius: 8
      output: 1500

    behaviors:
      - ManufacturingBehavior
      - PowerProducerBehavior

    nodes:
      - side: north
        kind: import

    visual:
      model_path: "res://Models/Buildings/power_plant.glb"
      scale: 2.0
      rotation_offset: [0, 0, 0]

    icon:
      base_path: "res://Assets/Icons/Buildings/power/fusion_reactor"

  - id_name: fission_reactor
    display_name: Fission Power Plant
    description: Fission reactors divide nuclear material to generate power
    category: power
    building_time: 900.0
    work_required: 150.0

    placement_requirements:
      biomes: ["*"]
      min_elevation: 0.2
      max_elevation: 0.8
      max_slope: 10.0
      cell_count: 9 # 3x3 grid
      requires_adjacent: true

    required_resources:
      steel: 500
      titanium: 300
      copper: 400
      electronics: 200
      uranium: 50
      water: 1000

    production:
      default_recipe: "pressurized_water_reactor"
      alternative_recipes: ["molten_salt", "lmfbr"]
      production_speed: 5

    power:
      grid_radius: 8
      output: 1200

    behaviors:
      - ManufacturingBehavior
      - PowerProducerBehavior

    nodes:
      - side: north
        kind: import

    visual:
      model_path: "res://Models/Buildings/power_plant.glb"
      scale: 2.0
      rotation_offset: [0, 0, 0]

    icon:
      base_path: "res://Assets/Icons/Buildings/power/fission_reactor"

  - id_name: antimatter_reactor
    display_name: Antimatter Reaction Plant
    description: Antimatter-matter reactions release massive quantities of energy that we can harness for power production
    category: power
    building_time: 900.0
    work_required: 150.0

    placement_requirements:
      biomes: [Grassland, Forest, StoneDesert, RustedPlain]
      min_elevation: 0.2
      max_elevation: 0.8
      max_slope: 10.0
      cell_count: 9 # 3x3 grid
      requires_adjacent: true

    required_resources:
      steel: 500
      titanium: 300
      copper: 400
      electronics: 200
      water: 1000
      antimatter: 100

    production:
      default_recipe: "antimatter_reaction"
      alternative_recipes: []
      production_speed: 5

    power:
      grid_radius: 10
      output: 3000

    behaviors:
      - ManufacturingBehavior
      - PowerProducerBehavior

    nodes:
      - side: north
        kind: import

    visual:
      model_path: "res://Models/Buildings/power_plant.glb"
      scale: 2.0
      rotation_offset: [0, 0, 0]

    icon:
      base_path: "res://Assets/Icons/Buildings/power/antimatter_reactor"
