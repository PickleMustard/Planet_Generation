buildings:
  - id_name: solar_array
    display_name: Solar Power Array
    description: Photovoltaic array for solar energy capture.
    category: power
    building_time: 360.0 # 1 hour in seconds
    work_required: 60.0

    placement_requirements:
      biomes: [category:desert, category:ocean, category:flat]
      min_elevation: 0.1
      max_elevation: 0.7
      max_slope: 5.0
      cell_count: 4 # 2x2 grid
      requires_adjacent: true

    required_resources:
      silicon: 200
      aluminum: 150
      copper: 100
      glass: 100
      electronics: 50

    production:
      default_recipe: "photovoltaic_capture"
      alternative_recipes: []
      production_speed: 2

    power:
      grid_radius: 4
      output: 100
      is_renewable: true

    behaviors:
      - ManufacturingBehavior
      - PowerProducerBehavior

    visual:
      model_path: "res://Models/Buildings/solar_array.glb"
      scale: 1.5
      rotation_offset: [0, 0, 0]

    icon:
      base_path: "res://Assets/Icons/Buildings/power/solar_array"
