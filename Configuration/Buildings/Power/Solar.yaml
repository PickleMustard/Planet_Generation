buildings:
  - id_name: solar_array
    display_name: Solar Power Array
    description: Photovoltaic array for solar energy capture.
    category: power
    building_time: 360.0 # 1 hour in seconds
    work_required: 60.0

    placement_requirements:
      biomes: [Desert, StoneDesert, RustedDesert, Grassland]
      min_elevation: 0.1
      max_elevation: 0.7
      max_slope: 5.0
      cell_count: 4 # 2x2 grid
      requires_adjacent: true

    required_resources:
      silicon: 200
      aluminum: 150
      copper: 100
      glass: 100
      electronics: 50

    production:
      default_recipe: "photovoltaic_capture"
      alternative_recipes: []
      input_storage_amount: 100
      output_storage_amount: 200
      production_speed: 2

    visual:
      model_path: "res://Models/Buildings/solar_array.glb"
      scale: 1.5
      rotation_offset: [0, 0, 0]
