buildings:
  - id_name: deep_sea_mine
    display_name: Deep Sea Mining Platform
    description: Automated underwater mining platform for extracting rare minerals and metals from ocean floors.
    category: extraction
    building_time: 7200.0 # 2 hours in seconds
    work_required: 1000.0

    placement_requirements:
      biomes: [category:deep_ocean]
      min_elevation: 0.0
      max_elevation: 0.1
      max_slope: 5.0
      cell_count: 3
      requires_adjacent: true

    required_resources:
      steel: 300
      titanium: 150
      copper: 200
      electronics: 100
      water: 500

    production:
      default_recipe: "deep_core_drilling"
      alternative_recipes: ["underwater_extraction", "mineral_processing"]
      input_storage_amount: 200
      output_storage_amount: 200
      production_speed: 3

    visual:
      model_path: "res://Models/Buildings/deep_sea_mine.glb"
      scale: 1.5
      rotation_offset: [0, 0, 180]

    icon:
      base_path: "res://Assets/Icons/Buildings/extraction/deep_sea_mine"
