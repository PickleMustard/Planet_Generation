buildings:
  - id_name: deep_sea_mine
    display_name: Deep Sea Mining Platform
    description: Automated underwater mining platform for extracting rare minerals and metals from ocean floors.
    category: extraction
    building_time: 7200.0  # 2 hours in seconds
    work_required: 1000.0
    
    placement_requirements:
      biomes: [Ocean, Coastal, Abyssal]
      min_elevation: 0.0
      max_elevation: 0.1
      max_slope: 5.0
      cell_count: 3
      requires_adjacent: true
    
    required_resources:
      steel: 300
      titanium: 150
      copper: 200
      electronics: 100
      water: 500
    
    production:
      extraction_rate: 2.5
      resources: [cobalt_ore, nickel_ore, manganese_nodules, rare_earth_elements]
      recipes: [deep_core_drilling, underwater_extraction, mineral_processing]
    
    visual:
      model_path: "res://Models/Buildings/deep_sea_mine.glb"
      scale: 1.5
      rotation_offset: [0, 0, 0]
  
  - id_name: mountain_extractor
    display_name: Mountain Mineral Extractor
    description: Heavy-duty mining facility built into mountain sides for extracting high-value ores and minerals.
    category: extraction
    building_time: 6000.0  # 1.67 hours in seconds
    work_required: 1200.0
    
    placement_requirements:
      biomes: [Mountain, RustedMountain, StoneDesert]
      min_elevation: 0.6
      max_elevation: 1.0
      max_slope: 30.0
      cell_count: 2
      requires_adjacent: false
    
    required_resources:
      steel: 400
      tungsten: 100
      concrete: 300
      explosives: 50
      water: 200
    
    production:
      extraction_rate: 3.0
      resources: [iron_ore, copper_ore, gold_ore, uranium_ore, platinum_ore]
      recipes: [tunnel_boring, ore_processing, smelting]
    
    visual:
      model_path: "res://Models/Buildings/mountain_extractor.glb"
      scale: 1.3
      rotation_offset: [0, 45, 0]
  
  - id_name: surface_quarry
    display_name: Surface Quarry
    description: Open-pit mining operation for bulk extraction of common minerals and construction materials.
    category: extraction
    building_time: 4800.0  # 1.33 hours in seconds
    work_required: 800.0
    
    placement_requirements:
      biomes: [StoneDesert, RustedPlain, ScouredPlain, Grassland]
      min_elevation: 0.3
      max_elevation: 0.7
      max_slope: 20.0
      cell_count: 4
      requires_adjacent: true
    
    required_resources:
      iron: 200
      steel: 100
      concrete: 400
      water: 300
    
    production:
      extraction_rate: 4.0
      resources: [stone, sand, clay, limestone, gravel]
      recipes: [excavation, crushing, sorting]
    
    visual:
      model_path: "res://Models/Buildings/surface_quarry.glb"
      scale: 1.8
      rotation_offset: [0, 0, 0]