      base_offset: 0.0
      latitude_factor_divisor: 9.0
      size_factor_divisor: 100.0
      random_min: -0.2
      random_max: 0.3
      max_moisture: 2.7
      constant_offset: 0.0
    assigner_rules:
      - biome_id: biome_mountain
        when: { height_above: 0.7 }
      - biome_id: biome_ocean
        when: { height_below: 0.05 }
      - biome_id: biome_coastal
        when: { height_below: 0.08 }
      - biome_id: biome_desert
        when: { moisture_below: 0.15 }
      - biome_id: biome_rainforest
        when: { moisture_above: 0.6 }
      - biome_id: biome_forest
        when: { moisture_above: 0.35 }
      - biome_id: biome_swamp
        when: { moisture_above: 0.15 }
      - biome_id: biome_grassland
        when: {}
    resource_groups: [commonOres, preciousOres, basicFuels, industrialMaterials]
    add_resources: []
    remove_resources: []

