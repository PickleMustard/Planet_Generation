# Rocky planet subtypes. Each entry defines its surface generation parameters
# (moisture, ordered biome assigner rules) and resource generation config.
# Migrated from biome_assigner_config.yaml + planetary_resource_config.yaml.

subtypes:
  - id: subtype_rocky_scoured
    display_name: Scoured
    atmosphere_min: 0.0
    atmosphere_max: 2.0
    base_hazard: 7.0
    base_resource_weight: 0.7
    moisture_mode: uniform_random
    moisture_params:
      random_min: 0.0
      random_max: 0.1
    assigner_rules:
      - biome_id: biome_mountain
        when: { height_above: 0.8 }
      - biome_id: biome_stone_desert
        when: { height_above: 0.4 }
      - biome_id: biome_sand_desert
        when: { height_above: 0.1 }
      - biome_id: biome_scoured_plain
        when: {}
    resource_groups: [commonOres, preciousOres, radioactiveOres, industrialMaterials]
    add_resources: []
    remove_resources: [clay]

  - id: subtype_rocky_desert
    display_name: Desert
    atmosphere_min: 0.0
    atmosphere_max: 2.0
    base_hazard: 4.0
    base_resource_weight: 0.8
    moisture_mode: uniform_random
    moisture_params:
      random_min: 0.0
      random_max: 0.15
    assigner_rules:
      - biome_id: biome_mountain
        when: { height_above: 0.8 }
      - biome_id: biome_stone_desert
        when: { height_above: 0.5 }
      - biome_id: biome_sand_desert
        when: { height_above: 0.2 }
      - biome_id: biome_desert
        when: { height_above: 0.05 }
      - biome_id: biome_stone_desert
        when: {}
    resource_groups: [commonOres, preciousOres, radioactiveOres, industrialMaterials]
    add_resources: []
    remove_resources: [clay]

  - id: subtype_rocky_temperate
    display_name: Temperate
    atmosphere_min: 0.0
    atmosphere_max: 2.0
    base_hazard: 1.0
    base_resource_weight: 1.0
    moisture_mode: whittaker
    moisture_params:
      base_offset: 0.0
      latitude_factor_divisor: 9.0
      size_factor_divisor: 100.0
      random_min: -0.4
      random_max: 0.2
      max_moisture: 2.7
      constant_offset: 0.0
    assigner_rules:
      - biome_id: biome_icecap
        when: { height_above: 0.9, abs_latitude_above: 0.9 }
      - biome_id: biome_mountain
        when: { height_above: 0.68, height_below: 0.9 }
      - biome_id: biome_tundra
        when: { height_above: 0.4, moisture_below: 0.5, abs_latitude_above: 0.8, abs_latitude_below: 0.9 }
      - biome_id: biome_taiga
        when: { height_above: 0.4, moisture_above: 0.5, abs_latitude_above: 0.7, abs_latitude_below: 0.8 }
      - biome_id: biome_ocean
        when: { height_below: 0.05 }
      - biome_id: biome_coastal
        when: { height_below: 0.07 }
      - biome_id: biome_desert
        when: { height_below: 0.3, moisture_below: 0.2, abs_latitude_above: 0.2, abs_latitude_below: 0.5 }
      - biome_id: biome_grassland
        when: { height_below: 0.3, moisture_above: 0.2, moisture_below: 0.5 }
      - biome_id: biome_forest
        when: { height_above: 0.3, moisture_above: 0.5, moisture_below: 0.7, abs_latitude_above: 0.2, abs_latitude_below: 0.5 }
      - biome_id: biome_rainforest
        when: { moisture_above: 0.6, abs_latitude_above: 0.0, abs_latitude_below: 0.2 }
    resource_groups: [commonOres, basicFuels, frozenVolatiles, industrialMaterials]
    add_resources: []
    remove_resources: []

  - id: subtype_rocky_tropical
    display_name: Tropical
    atmosphere_min: 0.0
    atmosphere_max: 2.0
    base_hazard: 2.0
    base_resource_weight: 1.0
