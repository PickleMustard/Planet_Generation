      - biome_id: biome_mountain
        when: { height_above: 0.65 }
      - biome_id: biome_glacier
        when: { height_above: 0.4, abs_latitude_above: 0.6 }
      - biome_id: biome_tundra
        when: { height_above: 0.4, abs_latitude_above: 0.4 }
      - biome_id: biome_ocean
        when: { height_below: 0.05 }
      - biome_id: biome_coastal
        when: { height_below: 0.07 }
      - biome_id: biome_frozen_plain
        when: { moisture_below: 0.3 }
